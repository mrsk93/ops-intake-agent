<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic missing field blocked state</title>
  <desc id="desc">Synthetic portfolio visual showing a missing destination postal code blocking preview.</desc>
  <rect width="1600" height="1000" fill="#f2f0e8"/>
  <text x="70" y="80" font-family="Arial" font-size="20" font-weight="700" fill="#182522">OPS INTAKE / REVIEW QUEUE</text>
  <text x="70" y="150" font-family="Georgia" font-size="58" font-weight="700" fill="#182522">Missing stays missing.</text>
  <text x="70" y="195" font-family="Arial" font-size="20" fill="#40524d">Synthetic REQ-A-101 · deterministic validation</text>
  <rect x="70" y="250" width="720" height="590" rx="18" fill="#fbfaf5" stroke="#b9c6bd"/>
  <text x="105" y="305" font-family="Arial" font-size="17" font-weight="700" fill="#40524d">CANONICAL FIELD</text>
  <text x="105" y="365" font-family="monospace" font-size="22" fill="#40524d">destination.postal_code</text>
  <text x="105" y="420" font-family="Arial" font-size="32" font-weight="700" fill="#a94127">Missing</text>
  <rect x="105" y="475" width="630" height="130" rx="12" fill="#fff1ed" stroke="#f2b3a5"/>
  <text x="135" y="520" font-family="monospace" font-size="17" font-weight="700" fill="#a94127">DESTINATION_POSTAL_REQUIRED</text>
  <text x="135" y="558" font-family="Arial" font-size="17" fill="#40524d">Supply a value with evidence.</text>
  <text x="135" y="585" font-family="Arial" font-size="17" fill="#40524d">No preview can be created.</text>
  <text x="840" y="305" font-family="Arial" font-size="17" font-weight="700" fill="#40524d">REVIEW DECISION</text>
  <rect x="840" y="345" width="650" height="300" rx="18" fill="#182522"/>
  <text x="880" y="410" font-family="Georgia" font-size="38" fill="#fff">Blocked</text>
  <text x="880" y="460" font-family="Arial" font-size="18" fill="#bfd3ca">Required value is absent from the</text>
  <text x="880" y="490" font-family="Arial" font-size="18" fill="#bfd3ca">normalized draft and source evidence.</text>
  <rect x="880" y="540" width="210" height="42" rx="7" fill="#62776e"/>
  <text x="910" y="567" font-family="Arial" font-size="16" font-weight="700" fill="#d8e5de">Preview disabled</text>
  <text x="70" y="930" font-family="Arial" font-size="14" fill="#40524d">SYNTHETIC PORTFOLIO ASSET · safe abstention · no guessed value</text>
</svg>
